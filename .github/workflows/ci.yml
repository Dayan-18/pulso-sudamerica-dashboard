name: Validar dashboard

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Revisar estilo
        run: ruff check .

      - name: Ejecutar pruebas
        run: pytest -q

      - name: Probar inicio de Streamlit
        shell: bash
        run: |
          streamlit run streamlit_app.py --server.headless true --server.port 8501 >streamlit.log 2>&1 &
          app_pid=$!
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8501/_stcore/health; then
              kill "$app_pid"
              exit 0
            fi
            sleep 2
          done
          cat streamlit.log
          kill "$app_pid" || true
          exit 1
